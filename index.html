<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Censor</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main>
        <div class="center">
            <h1>WORD CENSOR</h1>
            <input type="text" id="inputTag"> <button onclick="checkValue()" id="click">ENTER</button>
            <p id="outputTag"></p>
        </div>
    </main>
</body>

</html>
<script>
    let inputElement = document.getElementById('inputTag')
    let paragraphTag = document.getElementById('outputTag')

    function checkValue() {
        let valueType = inputElement.value
        valueType = inputElement.value.toLowerCase().replaceAll('stupid', '****').replaceAll('bastard', '****').replaceAll('fucking', '****').replaceAll('idiot', '****')
        paragraphTag.innerHTML = valueType


    }

</script>
